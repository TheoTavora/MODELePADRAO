<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/verificar.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Verificação de saúde</title>
</head>
<body>

<div class="container">
    <div class="form-container">
        <h3 class="text-center mb-4">Verificar Saúde do Paciente</h3>
        <form>
            <div class="mb-3">
                <label for="patient-id" class="form-label">ID do Paciente</label>
                <input type="text" class="form-control" id="patient-id" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="checkHealth()">Verificar Saúde</button>
        </form>
        <div id="health-status" class="status mt-4" style="display: none;"></div>
    </div>
</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>

</body>
</html>
